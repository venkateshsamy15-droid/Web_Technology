
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Information</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #2193b0, #6dd5ed);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    width: 100%;
    max-width: 480px;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    text-align: center;
}

h1 {
    color: #176b87;
    margin-top: 0;
}

.search-box {
    display: flex;
    gap: 8px;
    margin: 25px 0;
}

input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    background: #176b87;
    color: white;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #104e65;
}

.weather-card {
    display: none;
    background: #eaf8fc;
    padding: 22px;
    border-radius: 12px;
}

.weather-icon {
    font-size: 55px;
}

.temperature {
    font-size: 42px;
    font-weight: bold;
    color: #176b87;
    margin: 10px;
}

.details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
}

.detail {
    background: white;
    padding: 15px 8px;
    border-radius: 8px;
}

.detail p {
    margin: 5px;
}

#message {
    color: #d93025;
    font-weight: bold;
    margin-top: 15px;
}

.footer {
    color: #777;
    font-size: 12px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

    <h1>🌤 Weather Information</h1>
    <p>Enter a city name to check the current weather.</p>

    <div class="search-box">
        <input type="text" id="city"
               placeholder="Enter city name"
               maxlength="60">
        <button onclick="getWeather()">Search</button>
    </div>

    <p id="message"></p>

    <div class="weather-card" id="weatherCard">

        <h2 id="cityName"></h2>

        <div class="weather-icon" id="weatherIcon">🌤️</div>

        <div class="temperature" id="temperature"></div>

        <h3 id="condition"></h3>

        <div class="details">

            <div class="detail">
                <p>💧 Humidity</p>
                <strong id="humidity"></strong>
            </div>

            <div class="detail">
                <p>💨 Wind Speed</p>
                <strong id="wind"></strong>
            </div>

            <div class="detail">
                <p>🌡 Feels Like</p>
                <strong id="feels"></strong>
            </div>

            <div class="detail">
                <p>🌧 Precipitation</p>
                <strong id="rain"></strong>
            </div>

        </div>
    </div>

    <div class="footer">
        Weather data provided by Open-Meteo API
    </div>

</div>

<script>

function getWeather() {

    const city = document.getElementById("city").value.trim();
    const message = document.getElementById("message");
    const card = document.getElementById("weatherCard");

    message.textContent = "";
    card.style.display = "none";

    if (city === "") {
        message.textContent = "Please enter a city name.";
        return;
    }

    if (!/^[a-zA-Z][a-zA-Z .'-]*$/.test(city)) {
        message.textContent = "Please enter a valid city name.";
        return;
    }

    message.style.color = "#176b87";
    message.textContent = "Fetching weather data...";

    // AJAX Request 1: Fetch city coordinates as JSON
    fetch("https://geocoding-api.open-meteo.com/v1/search?name="
        + encodeURIComponent(city) + "&count=1&language=en&format=json")

    .then(response => {
        if (!response.ok) {
            throw new Error("Unable to connect to the API.");
        }
        return response.json();
    })

    .then(locationData => {

        if (!locationData.results || locationData.results.length === 0) {
            throw new Error("City not found. Please try another city.");
        }

        const location = locationData.results[0];

        // AJAX Request 2: Fetch weather data as JSON
        const apiURL =
            "https://api.open-meteo.com/v1/forecast"
            + "?latitude=" + location.latitude
            + "&longitude=" + location.longitude
            + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m"
            + "&timezone=auto";

        return fetch(apiURL)
        .then(response => {
            if (!response.ok) {
                throw new Error("Weather data could not be loaded.");
            }
            return response.json();
        })
        .then(weatherData => ({
            location: location,
            weather: weatherData
        }));

    })

    .then(data => {

        const location = data.location;
        const current = data.weather.current;

        document.getElementById("cityName").textContent =
            location.name + ", " + (location.country || "");

        document.getElementById("temperature").textContent =
            current.temperature_2m + " °C";

        document.getElementById("humidity").textContent =
            current.relative_humidity_2m + " %";

        document.getElementById("wind").textContent =
            current.wind_speed_10m + " km/h";

        document.getElementById("feels").textContent =
            current.apparent_temperature + " °C";

        document.getElementById("rain").textContent =
            current.precipitation + " mm";

        const weather = getCondition(current.weather_code);

        document.getElementById("condition").textContent =
            weather.text;

        document.getElementById("weatherIcon").textContent =
            weather.icon;

        card.style.display = "block";
        message.textContent = "";

    })

    .catch(error => {
        message.style.color = "#d93025";
        message.textContent = error.message;
    });
}

function getCondition(code) {

    if (code === 0) return {text: "Clear Sky", icon: "☀️"};

    if ([1, 2, 3].includes(code))
        return {text: "Partly Cloudy", icon: "🌤️"};

    if ([45, 48].includes(code))
        return {text: "Foggy", icon: "🌫️"};

    if ([51, 53, 55, 56, 57].includes(code))
        return {text: "Drizzle", icon: "🌦️"};

    if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code))
        return {text: "Rainy", icon: "🌧️"};

    if ([71, 73, 75, 77, 85, 86].includes(code))
        return {text: "Snowfall", icon: "❄️"};

    if ([95, 96, 99].includes(code))
        return {text: "Thunderstorm", icon: "⛈️"};

    return {text: "Weather Information", icon: "🌡️"};
}

// Press Enter to search
document.getElementById("city").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        getWeather();
    }
});

</script>

</body>
</html>
