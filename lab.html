
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Professional Book Information System</title>

    <!-- jQuery Library -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #49369c;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .button-area {
            text-align: center;
            margin: 25px 0;
        }

        button {
            background: #5542a5;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #382778;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin: 20px 0;
        }

        .book-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .book-card {
            background: #faf9ff;
            border: 1px solid #e0dcf5;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 18px rgba(0,0,0,0.13);
        }

        .book-card img {
            width: 125px;
            height: 175px;
            object-fit: cover;
            border-radius: 6px;
            background: #eee;
            margin-bottom: 12px;
        }

        .no-cover {
            width: 125px;
            height: 175px;
            background: #e8e4f7;
            border-radius: 6px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        .book-number {
            display: inline-block;
            background: #5542a5;
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .book-card h3 {
            color: #49369c;
            font-size: 18px;
            margin: 8px 0 15px;
        }

        .book-card p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .book-card strong {
            color: #333;
        }

        .footer {
            text-align: center;
            color: #777;
            margin-top: 30px;
            font-size: 13px;
        }

        @media(max-width: 500px) {
            .container {
                padding: 20px 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📚 Book Information System</h1>

    <p class="subtitle">
        Fetch and display book details using jQuery and AJAX
    </p>

    <div class="button-area">
        <button id="loadBooks">Load Books</button>
    </div>

    <div id="message">
        Click the Load Books button to display book information.
    </div>

    <div class="book-list" id="bookList"></div>

    <div class="footer">
        Book data provided by Open Library API
    </div>

</div>

<script>

$(document).ready(function() {

    $("#loadBooks").click(function() {

        $("#bookList").empty();

        $("#message")
            .css("color", "#5542a5")
            .text("Loading book information...");

        $("#loadBooks").prop("disabled", true);

        // AJAX GET Request
        $.ajax({

            url: "https://openlibrary.org/search.json?q=javascript&limit=10",

            type: "GET",

            dataType: "json",

            success: function(response) {

                if (!response.docs || response.docs.length === 0) {

                    $("#message")
                        .css("color", "red")
                        .text("No books found.");

                    return;
                }

                $("#message")
                    .css("color", "green")
                    .text("Books loaded successfully!");

                // Process JSON response
                $.each(response.docs, function(index, book) {

                    let title = book.title || "Untitled Book";

                    // Remove duplicate author names
                    let author = book.author_name
                        ? [...new Set(book.author_name)]
                            .filter(name => name && name.trim() !== "")
                            .join(", ")
                        : "Author Information Not Available";

                    let year = book.first_publish_year || "Not Available";

                    let publisher = book.publisher && book.publisher.length > 0
                        ? book.publisher[0]
                        : "Not Available";

                    // Book cover image
                    let cover = book.cover_i
                        ? "https://covers.openlibrary.org/b/id/" + book.cover_i + "-M.jpg"
                        : "";

                    let card = $("<div>").addClass("book-card");

                    card.append(
                        $("<span>")
                            .addClass("book-number")
                            .text("BOOK " + (index + 1))
                    );

                    if (cover) {

                        let image = $("<img>")
                            .attr("src", cover)
                            .attr("alt", title);

                        image.on("error", function() {
                            $(this).replaceWith(
                                $("<div>")
                                    .addClass("no-cover")
                                    .text("📖")
                            );
                        });

                        card.append(image);

                    } else {

                        card.append(
                            $("<div>")
                                .addClass("no-cover")
                                .text("📖")
                        );

                    }

                    card.append(
                        $("<h3>").text(title)
                    );

                    card.append(
                        $("<p>").append(
                            $("<strong>").text("Author: "),
                            document.createTextNode(author)
                        )
                    );

                    card.append(
                        $("<p>").append(
                            $("<strong>").text("Published Year: "),
                            document.createTextNode(year)
                        )
                    );

                    card.append(
                        $("<p>").append(
                            $("<strong>").text("Publisher: "),
                            document.createTextNode(publisher)
                        )
                    );

                    $("#bookList").append(card);

                });

            },

            error: function() {

                $("#message")
                    .css("color", "red")
                    .text("Unable to retrieve book data. Please check your internet connection.");

            },

            complete: function() {

                $("#loadBooks").prop("disabled", false);

            }

        });

    });

});

</script>

</body>
</html>
